<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Ripple — Climate Doesn't Create Inequality. It Reveals It.</title>
    <meta
      name="description"
      content="An interactive data story exploring how climate change amplifies existing social and economic vulnerabilities across the Pacific. Built for the 2026 Pacific DataViz Challenge."
    />
  </head>
  <body>
    <!--
      Runs before React mounts, and before first paint, so a dark-mode visitor
      doesn't get a frame of the light palette. Deliberately duplicates
      getInitialTheme() in src/hooks/useTheme.jsx (same 'ripple-theme' key,
      same stored-choice-beats-OS-preference order) -- an import couldn't run
      early enough. Keep the two in step.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ripple-theme')
          var dark = stored === 'dark' || (!stored && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* private mode, storage disabled -- fall through to light */
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
