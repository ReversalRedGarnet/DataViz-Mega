<!--
  Custom cursor, replacing the OS default everywhere on the site (see
  the `cursor: url(...) 2 2, auto !important` rule in index.css).

  Shape is based on a barbed Pacific weapon (reference photo supplied
  by the site's author), simplified to a silhouette that still reads
  at true 32x32 cursor scale: a sequence of alternating outward-tip /
  inward-notch barbs along the blade's back edge, tapering to a thin
  shaft with two small wrap ticks hinting at the bound grip.

  Hotspot is the tip at local (2,2), matching the "2 2" in the CSS
  cursor url() below, so clicks register exactly where the point is
  rather than at the arrow-tip offset browsers use by default.

  The shape is drawn at its original full-length proportions, then
  scaled 0.75x around the hotspot (the <g transform> below) so the
  cursor's actual on-screen reach is closer to a standard OS arrow
  pointer's: the original spanned nearly the whole 32x32 canvas
  corner-to-corner, which read as oversized next to every other
  cursor a visitor is used to. Scaling around the hotspot rather than
  hand-editing every point keeps the barb geometry and stroke
  proportions exactly as drawn, just shorter.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <g transform="translate(2,2) scale(0.75) translate(-2,-2)">
    <polygon
      points="2.00,2.00 2.42,4.83 2.28,7.80 4.62,7.30 4.19,10.13 6.60,9.57 6.53,12.04 8.65,11.48 9.92,13.17 13.53,15.22 17.03,18.09 21.20,21.69 22.86,22.86 19.36,18.58 15.40,14.06 12.25,10.13 9.99,7.02 8.47,5.43 9.28,3.20 6.99,4.09 5.46,2.78 2.00,2.00"
      fill="#24333A"
      stroke="#7A8183"
      stroke-width="0.55"
      stroke-linejoin="round"
    />
    <line x1="18.69" y1="20.67" x2="20.67" y2="18.69" stroke="#7A8183" stroke-width="0.6" />
    <line x1="20.10" y1="22.08" x2="22.08" y2="20.10" stroke="#7A8183" stroke-width="0.6" />
  </g>
</svg>
